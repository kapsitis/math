# Estonian regional olympiad (Piirkonnavoor): short-answer test ("I osa") for
# grades 7-9, in Estonian and Russian; solutions later in the same PDF.
# Usage:
#   python scripts/ocr/pdf_ocr.py sources/EE_PK pk2006.pdf scripts/ocr/ee_pk_test.yaml
#   python scripts/ocr/extract_figures.py sources/EE_PK pk2006.pdf scripts/ocr/ee_pk_test.yaml
#   python scripts/ocr/md_to_test_docx.py sources/EE_PK/ee-pk-2006test --config scripts/ocr/ee_pk_test.yaml

year_regex: '(\d{4})'                      # applied to the PDF file name
problem_id_prefix: 'EE.PK.{year}TEST'      # problem IDs: EE.PK.2006TEST.7.6
output_dir: '{parent}/ee-pk-{year}test'    # {parent} = the first command-line argument
png_name: '{stem}_p{page}.png'             # {page} is zero-padded: pk2006_p002.png
question_type: ShortAnswer

# Page ranges differ between the PDFs; they are listed in list.csv
# (columns File,ee_first,ee_last,ru_first,ru_last) and used as {csv:column}.
page_list:
  file: list.csv
  key_column: File

# PDFs and page ranges (1-based, both ends included; "end" = last page).
sources:
  test_ee:
    file: '{pdf}'
    pages: ['{csv:ee_first}', '{csv:ee_last}']
  test_ru:
    file: '{pdf}'
    pages: ['{csv:ru_first}', '{csv:ru_last}']
  solutions:                                 # "Lahendused ja vastused" follows the tests
    file: '{pdf}'
    pages: ['{csv:ru_last}+1', end]
    png_subdir: answer_pages

grades: [7, 8, 9]

render:
  dpi: 200

# All lengths are PDF points (1/72 inch); the pages are A5 (420 x 595 pt).
geometry:
  margins:                 # always trimmed; may be overridden with "odd:"/"even:" sub-maps
    left: 22
    right: 22
    top: 20
    bottom: 12
  header:                  # text blocks ending within "zone" pt from the top edge and
    zone: 92               # matching "regex" are cut away (with the box around them)
    regex: 'klass|класс|êëàññ|olümpiaad|Олимпиада|Îëèìïèàäà|Piirkonnavoor|Региональный'
    padding: 6
  footer:                  # text blocks starting within "zone" pt from the bottom edge
    zone: 40               # and matching "regex" (page numbers) are cut away
    regex: '^\s*\d+\s*$'
    padding: 2

languages:
  ee:
    problems: test_ee
    grade_regex: '(\d+)\.\s*klass'         # grade in the page header
    solutions: solutions
    solutions_find:        # the part of "solutions" that belongs to one grade:
      start_regex: '{grade}\.\s*klass,?\s*I\s+osa'     # first page with this heading
      end_regex: '\d+\.\s*klass,?\s*I{1,2}\s+osa'      # ... up to the next heading
      must_contain: 'Lahendused'
      max_pages: 4
    prompt: user_ee
    output: content_ee.md
  ru:
    problems: test_ru
    grade_regex: '(\d+)\s*(?:класс|êëàññ)'
    answers_from: ee       # gets the Estonian Markdown (answers, solutions) as text
    prompt: user_ru
    output: content_ru.md

llm:
  provider: openai
  api_key_env: OPENAI_API_KEY
  model_env: OPENAI_MODEL
  model: gpt-5.5           # used when OPENAI_MODEL is not set
  max_completion_tokens: 32000
  temperature: null        # null = model default (required by reasoning models)
  image_detail: high

# Placeholders: {id_prefix} {grade} {year} {stem} {num_problem_pages}
# {num_answer_pages} {source_markdown}. Other braces (LaTeX) are kept verbatim.
prompts:
  system: |
    You convert scanned pages of a mathematics olympiad into Markdown.
    Copy the problem texts exactly in their original language; do not
    paraphrase, shorten or solve anything yourself unless explicitly asked.
    Convert math formulas into LaTeX and enclose them in $...$ (inline) or
    $$...$$ (display). Ignore page headers, the test instructions
    ("I osa. Lahendamisaega ...", "I часть. Время ..."), and the answer
    placeholders (dotted lines "..........").
    Start and terminate your whole output with three backquotes (```).

  user_ee: |
    The first {num_problem_pages} image(s) contain the short-answer test
    ("I osa") for grade {grade}, in Estonian. The remaining {num_answer_pages}
    image(s) are pages from the official solutions section
    ("Lahendused ja vastused"); use only the part titled
    "{grade}. klass, I osa" and ignore solutions of other grades or of "II osa".

    Output every test problem of grade {grade} in order, as follows
    (N is the problem number as printed on the page):

    ```
    # <lo-sample/> {id_prefix}.{grade}.N

    Problem text in Estonian (exactly as in the test pages).

    <small>

    * answer:ANSWER
    * questionType:ShortAnswer

    </small>

    ## Lahendus

    Solution text in Estonian (exactly as in the solutions section).


    # <lo-sample/> {id_prefix}.{grade}.N+1
    ...
    ```

    Rules:
    - ANSWER is the final answer from the solutions section, written on one
      line in a short form (e.g. 165, 3/5, 2,4\pi cm, 3; 5). If the solutions
      section gives no explicit answer for a problem, derive it from the
      solution text; if even that is impossible, write "answer:TODO".
    - The <small> section MUST contain both keys "answer" and
      "questionType:ShortAnswer" as shown.
    - If the solution is only an answer without explanation, still add the
      "## Lahendus" section with that answer.
    - Do not describe or redraw pictures. Where a problem contains a figure,
      insert a placeholder at the position of the figure:
      ![]({id_prefix}.{grade}.N.png) for the first figure, then
      ![]({id_prefix}.{grade}.NA.png), ![]({id_prefix}.{grade}.NB.png), etc.
      for further figures of the same problem. Figures inside the solution
      get the same kind of placeholders, continuing the letter sequence.
    - Separate problems by two empty lines.

  user_ru: |
    The images contain the short-answer test ("I часть") for grade {grade},
    in Russian. The same problems were already converted from the Estonian
    version; that Markdown is given below. It uses the same problem numbers.

    Output every Russian test problem of grade {grade} in order, with the
    same structure and the same problem IDs as the Estonian Markdown:

    ```
    # <lo-sample/> {id_prefix}.{grade}.N

    Problem text in Russian (exactly as in the images).

    <small>

    * answer:ANSWER (copied from the Estonian problem with the same ID;
      translate words, if any, into Russian and use the same number format)
    * questionType:ShortAnswer

    </small>

    ## Решение

    Russian translation of the Estonian "## Lahendus" section.
    ```

    Rules:
    - The <small> section MUST contain both keys "answer" and
      "questionType:ShortAnswer".
    - Do not describe or redraw pictures. Use the same figure placeholders
      (![](...png)) as the Estonian Markdown, placed at the corresponding
      positions of the Russian text.
    - Separate problems by two empty lines.

    Estonian Markdown:

    {source_markdown}

# Settings for extract_figures.py (cuts figures for the ![](...png) placeholders
# out of the page PNGs). Lengths are PDF points, like "geometry".
figures:
  language: ee               # figures are cut from the pages of this language only
  padding: 3                 # extra space around every figure
  use_llm: true              # ask the model only when local matching is ambiguous
  preview_subdir: figure_previews
  marker:                    # problem numbers "1.", "2.", ... at the left margin
    regex: '^\s*(\d{1,2})\.\s*$'
    font_regex: 'SFSX|Bold'  # bold sans-serif numbering font of these PDFs
    max_x: 60
  cluster:
    gap: 6                   # drawings closer than this belong to one figure
    min_size: 10             # figure must be at least this wide and high ...
    min_items: 4             # ... or consist of this many drawings and
    min_long: 40             #     be this long (e.g. a number line)
    min_image_side: 8        # smaller raster images (fraction rules) are ignored
    label_margin: 8          # short text spans this close are figure labels
    label_max_width: 45
    ignore_text_regex: '^[\s.…]+$'
  caption_regex: '^\s*Joonis\s+(\d+)\s*$'          # caption span in the answer pages
  caption_mention_regex: '[Jj]oonis\w*\s+(\d+)'    # caption number in the Markdown
  caption_max_gap: 40        # max distance between figure bottom and its caption

  prompts:
    system: |
      You help to cut figures out of scanned pages of a mathematics olympiad.
      Candidate figures are marked on the page images with red boxes, each
      with a number in its top-left corner. Answer with JSON only.
    select: |
      The {part} of problem {problem_id} contains these figure placeholders,
      in this order:
      {placeholders}

      Markdown of the {part} (placeholders show where each figure belongs):
      {text}

      Images: {pages}.
      For every placeholder return the numbers of the red boxes that together
      form that figure (several numbers if a figure is split into several
      boxes). If no box covers the figure, return instead
      {"image": <image number>, "bbox": [x0, y0, x1, y1]} with coordinates
      scaled to 0..1000 of that image's width and height.
      Example: {"EE.PK.2006TEST.7.10.png": [3], "EE.PK.2006TEST.7.10A.png": [4, 5]}

# Settings for md_to_test_docx.py (content_<lang>.md -> content_<lang>.docx test
# sheets without answers). Defaults are in the script; lengths in mm.
docx:
  answer_column: 60          # right column: answer box + points square + dotted lines
  answer_box: [45, 12]
  points_box: 8
  reasoning_lines: 3         # 0..4 dotted lines under the answer box
  reasoning_line_height: 6
  figure_dpi: 200            # = render.dpi above (figure PNG pixels -> mm)
  wide_figure_ratio: 0.6     # figures wider than this share of the text area go under the text
  max_side_figure_ratio: 0.6
  labels:                    # per language (content_<lang>.md); "lv" is the fallback
    lv:
      title: 'Matemātikas īso atbilžu tests — {grade}. klase — I daļa — variants {variant}'
      name: 'Vārds, uzvārds:'
      class: 'Klase:'
      answer: 'Atbilde:'
